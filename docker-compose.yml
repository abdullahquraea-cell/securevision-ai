services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    restart: always
    env_file: .env
    depends_on:
      - db

  admin:
    build:
      context: ./admin
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    depends_on:
      - backend

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    restart: always
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - admin
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config: